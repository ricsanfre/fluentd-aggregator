---
name: Build

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "10 1 * * 0"
  # Manual trigger, so an image can be rebuilt without pushing a commit. It runs the
  # release job when dispatched on master.
  workflow_dispatch:

jobs:
  # Pull requests: compile the Dockerfile without publishing anything, so a broken base
  # image or plugin fails here instead of on master. Uses the Dockerfile's default TAG
  # (the newest release) and a single platform to keep the feedback fast; the release
  # job below still builds every version for amd64 and arm64.
  build:
    name: Build (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build image.
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ github.repository }}:pr-${{ github.event.pull_request.number }}

  # On master (merge, schedule or manual dispatch), build and release every version.
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    strategy:
      matrix:
        release: [v1.17.1-debian-1.0, v1.18-debian-1, v1.20.1-debian-1.1]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images.
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          build-args: TAG=${{ matrix.release }}
          tags: ${{ github.repository }}:${{ matrix.release }}
